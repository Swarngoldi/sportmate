version: '3.8'

networks:
  sportmate-net:
    driver: bridge

services:
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - sportmate-net
    restart: unless-stopped

  backend:
